name: Truth Engine

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 fonts-dejavu-core

      # Versions pinned: thresholds are calibrated against specific rendering
      # and CV library behaviour (ADR-026), so an unpinned bump could shift
      # font metrics or FFT output and flip a zero-headroom gate.
      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "numpy==2.1.3" \
            "opencv-python-headless==4.10.0.84" \
            "pillow==10.4.0" \
            "pyyaml==6.0.2" \
            "faker==22.0.0" \
            "qrcode==7.4.2" \
            "pytest==8.3.3"

      - name: Unit tests (Truth Engine scope)
        run: |
          python -m pytest -q \
            tests/unit/test_copy_move.py \
            tests/unit/test_spoof_scorer.py \
            tests/unit/test_forensics.py \
            tests/unit/test_identity_forge.py \
            tests/unit/test_tamper_forge.py \
            tests/unit/test_eval_metrics.py

      # Datasets regenerate from fixed seeds — nothing committed, fully
      # reproducible. Forensics + decision tiers only (no model dependency);
      # the VLM extraction tier is certified locally via `make eval`.
      - name: Eval gates (forensics + decision)
        run: python -m tools.eval.run_eval --no-extraction --check

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truth-engine-report
          path: |
            eval/report.html
            eval/metrics.json
