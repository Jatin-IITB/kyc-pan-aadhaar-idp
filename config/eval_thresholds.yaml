# CI gates for `make eval` (Phase 11 W3, ADR-025).
#
# Values encode the CURRENT measured floor, not aspirations: the build is green
# today and goes red the moment a change degrades a certified metric. Raise a
# floor only after the eval report proves the improvement is real.

forensics:
  # A KYC system must never flag a genuine customer's document. Hard invariant,
  # confirmed 0/60 across tuning AND held-out seed pairs (W4, ADR-028).
  genuine_fpr_max: 0.0
  # Recall ratcheted after W4 forensic precision pass (ADR-028). CAVEAT: text_splice
  # and regenerate recall is via JPEG quality metadata — catches forge artifacts and
  # lazy real-world attacks, but is trivially evadable by a competent adversary
  # saving at Q≥88. Robust detection needs pixel/frequency-domain approaches (W5+).
  # Ratcheted after W6 template-font forensics (ADR-030): holdout overall
  # recall 63.9% -> 75.6% with genuine FPR held at 0 on both passes. Values
  # reflect the REPRODUCIBLE profile (post-audit re-emit, ADR-030 C1) — the
  # first emit was fit on stale cached data and measured higher.
  overall_recall_min: 0.88
  per_attack_recall_min:
    # W14: patch-NCC verification (ADR-038). tuning 0.80 / holdout 0.90.
    copy_move: 0.77
    exif_edit: 0.90        # tuning 1.00 / holdout 1.00
    # W9: radial-ring FFT scan, W11: combined moire+ring score.
    # tuning 0.77 / holdout 0.87 (period-13 recovered via combined score).
    screen_recapture: 0.70
    text_splice: 0.90      # W4: JPEG quality gate (tautological on forge — see ADR-028 L1-L2)
    # W6+W8+W12+W15: template-conformance typography with per-doc-type
    # vote/margin and id_width_cv for Aadhaar (ADR-030, ADR-032, ADR-036).
    # W15: per-feature margin for PAN corner_top (ADR-039).
    #
    # W17 RE-CERTIFIED DOWN 0.73 -> 0.70 (tuning 0.73 / holdout 0.70).
    # This is the one floor the Windows-corpus recalibration could not hold,
    # and it is lowered because the old value was never real. The 0.73 was
    # certified against a corpus rendered with PIL's default bitmap font for
    # every typographic kind (the fonts.py gap fixed in 33b9f46): font_swap
    # permuted roles that all resolved to ONE face, so the "attack" re-rendered
    # a near-identical card and the recall credited to it was the envelope
    # firing on documents it could not describe — the same defect that showed
    # up as 70-87% genuine FPR. Measured honestly on real Windows typography
    # at 0% genuine FPR (LOO-validated, both seeds), font_swap recall is
    # tuning 22/30, holdout 21/30. The 3 holdout misses are low-severity
    # swaps (bold->serif only) whose measured signature is inside the genuine
    # envelope; no margin/vote combination recovers them without reintroducing
    # false positives, and per this file's own policy a floor records what is
    # measured today. Raising it again needs an Aadhaar typography feature
    # that works on 4-glyph number groups, not a threshold move.
    font_swap: 0.70
    regenerate: 0.90       # W4: JPEG quality gate (tautological on forge — see ADR-028 L1-L2)

decision:
  # Forensically-FLAGGED documents that still AUTO_CLEAR through the real
  # calibrator + override engine: a decision-layer bug. Zero, always.
  flagged_leakage_max: 0
  # Forgeries forensics cannot see (blind spots) that therefore auto-clear.
  # W4 closed text_splice/regenerate (135 -> 75); W6+W8 closed most of the
  # font_swap blind spot; W9 ring scan closed more screen_recapture;
  # W10 SIFT fallback closed more copy_move; W11 combined score closed
  # more screen_recapture; W12 Aadhaar font closed more font_swap;
  # W13 SIFT merge closed more copy_move; W14 patch-NCC closed more
  # copy_move; W15 per-feature PAN margin (tuning 20 / holdout 14).
  undetected_autoclear_max: 20
  # Genuine docs (perfect extraction) that auto-clear. With clean forensics
  # (0% FPR), this should be 1.0.
  genuine_auto_clear_min: 0.95

extraction:
  # Applied only when the VLM extraction tier runs (requires Ollama).
  micro_f1_min: 0.85
  fuzzy_f1_min: 0.90
