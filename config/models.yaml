yolov8:
  pan_fields:
    weights: models/yolov8/pan_field_detector_v1/best.pt
    imgsz: 640
    conf: 0.25
    field_map:
      # Classes emitted by our trained model (Roboflow pancard-info-detection v1).
      # Verify with: YOLO(weights).names — unmapped classes are dropped, not renamed.
      pan: pan_number
      name: name
      fathername: father_name
      dob: dob
      # Tolerated aliases from other PAN datasets / retrains
      PAN_NUMBER: pan_number
      NAME: name
      FATHER_NAME: father_name
      DOB: dob
      DATE_OF_BIRTH: dob
      pan_number: pan_number
      holder_name: name
      father_name: father_name
      date_of_birth: dob
      SIGNATURE: signature
      PHOTO: photo

  aadhar_fields:
    weights: models/yolov8/aadhar_field_detector_v1/best.pt
    imgsz: 640
    conf: 0.25
    field_map:
      # arnabdhar/YOLOv8-nano-aadhar-card classes
      AADHAR_NUMBER: aadhaar_number
      NAME: name
      DATE_OF_BIRTH: dob
      GENDER: gender
      ADDRESS: address
      # Roboflow AADHAAR-CARD-DETAILS classes
      aadhaar_no: aadhaar_number
      aadhaar_holder_name: name
      aadhaar_dob: dob
      aadhaar_gender: gender
      aadhaar_address: address
      aadhaar_photo: photo

rotation:
  # Off until a model passes tools/train/eval_rotation.py on in-domain PAN/Aadhaar
  # images. The v1 Kaggle-trained model scored 0/4 on real PAN rotations.
  enabled: false
  architecture: "mobilenet_v3_small"
  weights: models/rotation_classifier/best.pt
  input_size: 224
  classes: ["rot0", "rot90", "rot180", "rot270"]
  min_confidence: 0.90

vlm:
  model: "minicpm-v"
  timeout_s: 120
  yolo_confidence_threshold: 0.60

llm:
  model: "qwen3:8b"
  timeout_s: 20
