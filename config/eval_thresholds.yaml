# CI gates for `make eval` (Phase 11 W3, ADR-025).
#
# Values encode the CURRENT measured floor, not aspirations: the build is green
# today and goes red the moment a change degrades a certified metric. Raise a
# floor only after the eval report proves the improvement is real.

forensics:
  # A KYC system must never flag a genuine customer's document. Hard invariant,
  # confirmed 0/60 across the tuning AND held-out seed pairs (ADR-026).
  genuine_fpr_max: 0.0
  # HONEST recall on the 6-attack red team after de-gaming (ADR-026): copy-move
  # offsets no longer aligned to the detector grid, screen includes an
  # undetectable evasion case, font de-scored. Floors sit below the held-out
  # measurement (the lower of tuning/holdout), not the tuning number. Target
  # remains 0.97 overall — raising these floors is the W4/W5 exit criterion.
  overall_recall_min: 0.25
  per_attack_recall_min:
    copy_move: 0.40        # tuning 0.47 / holdout 0.53
    exif_edit: 0.90        # tuning 1.00 / holdout 1.00
    screen_recapture: 0.15 # tuning 0.23 / holdout 0.40 (evasion case is by-design undetectable)
    text_splice: 0.0       # 0% today — needs block-wise ELA (W4 backlog)
    font_swap: 0.0         # 0% today — font prior is 0, needs OCR context (W5)
    regenerate: 0.0        # 0% today — needs PRNU / sensor analysis (W4 backlog)

decision:
  # Forensically-FLAGGED documents that still AUTO_CLEAR through the real
  # calibrator + override engine: a decision-layer bug. Zero, always.
  flagged_leakage_max: 0
  # Forgeries forensics cannot see (blind spots) that therefore auto-clear.
  # Now measured with font de-scored (ADR-026): no incidental font noise masks
  # blind spots, so this reflects the TRUE recall gap (128/180 today, up from
  # the illusory 41 when font noise was accidentally catching forgeries).
  # Ratchets DOWN as W4/W5 close each blind spot.
  undetected_autoclear_max: 135
  # Genuine docs (perfect extraction) that auto-clear. Guards against a
  # detector regression silently tanking the auto-clear rate (audit S2 caught
  # font noise collapsing it to 26.7%).
  genuine_auto_clear_min: 0.90

extraction:
  # Applied only when the VLM extraction tier runs (requires Ollama).
  micro_f1_min: 0.85
  fuzzy_f1_min: 0.90
