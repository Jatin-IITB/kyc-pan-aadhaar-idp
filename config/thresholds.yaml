# Quality Gate (pre-processing image rejection)
quality_gate:
  min_blur_score: 12
  max_white_ratio: 0.5
  max_black_ratio: 0.15
  max_resolution: 1600

# Confidence Thresholds (routing decisions)
confidence:
  crop_min: 0.80
  ocr_min: 0.70
  extraction_min: 0.75
  validation_min: 0.85
  hitl_trigger: 0.85

# Validation Rules
validation:
  pan:
    regex: "^[A-Z]{5}[0-9]{4}[A-Z]$"
    status_char_index: 3
    valid_statuses: ["P", "C", "H", "F", "A", "T", "B", "L", "J", "G"]
  aadhaar:
    digit_count: 12
    enforce_verhoeff: true
    allow_masked: false

# Scoring Weights
field_weights:
  ocr_confidence: 0.30
  extraction_agreement: 0.25
  validation_score: 0.30
  spatial_consistency: 0.10
  format_match: 0.05

# Rescue & Partial Logic
rescue_logic:
  trust_llm_corrections: true
  min_field_coverage: 0.75
  min_partial_score: 1.75
