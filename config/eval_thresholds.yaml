# CI gates for `make eval` (Phase 11 W3, ADR-025).
#
# Values encode the CURRENT measured floor, not aspirations: the build is green
# today and goes red the moment a change degrades a certified metric. Raise a
# floor only after the eval report proves the improvement is real.

forensics:
  # A KYC system must never flag a genuine customer's document. Hard invariant,
  # confirmed 0/60 across tuning AND held-out seed pairs (W4, ADR-028).
  genuine_fpr_max: 0.0
  # Recall ratcheted after W4 forensic precision pass (ADR-028). CAVEAT: text_splice
  # and regenerate recall is via JPEG quality metadata — catches forge artifacts and
  # lazy real-world attacks, but is trivially evadable by a competent adversary
  # saving at Q≥88. Robust detection needs pixel/frequency-domain approaches (W5+).
  # Ratcheted after W6 template-font forensics (ADR-030): holdout overall
  # recall 63.9% -> 76.7%, with genuine FPR held at 0 on both passes.
  overall_recall_min: 0.70
  per_attack_recall_min:
    copy_move: 0.50        # tuning 0.60 / holdout 0.63
    exif_edit: 0.90        # tuning 1.00 / holdout 1.00
    screen_recapture: 0.30 # tuning 0.33 / holdout 0.43 (evasion case is by-design undetectable)
    text_splice: 0.90      # W4: JPEG quality gate (tautological on forge — see ADR-028 L1-L2)
    # W6: template-conformance typography. NOT tautological — envelopes are
    # calibrated on a disjoint seed and validated against this eval's own
    # independent genuine set. See ADR-030.
    font_swap: 0.45        # tuning 0.53 / holdout 0.53
    regenerate: 0.90       # W4: JPEG quality gate (tautological on forge — see ADR-028 L1-L2)

decision:
  # Forensically-FLAGGED documents that still AUTO_CLEAR through the real
  # calibrator + override engine: a decision-layer bug. Zero, always.
  flagged_leakage_max: 0
  # Forgeries forensics cannot see (blind spots) that therefore auto-clear.
  # W4 closed text_splice/regenerate (135 -> 75); W6 closed most of the
  # font_swap blind spot (tuning 46 / holdout 42).
  undetected_autoclear_max: 50
  # Genuine docs (perfect extraction) that auto-clear. With clean forensics
  # (0% FPR), this should be 1.0.
  genuine_auto_clear_min: 0.95

extraction:
  # Applied only when the VLM extraction tier runs (requires Ollama).
  micro_f1_min: 0.85
  fuzzy_f1_min: 0.90
